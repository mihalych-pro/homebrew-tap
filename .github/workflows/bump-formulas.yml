name: Bump formulas

# Every six hours, open one pull request per outdated package. The companion
# workflow (merge-automated-prs.yml) merges them once they are a day old.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated names to bump; empty means everything outdated"
        required: false

permissions:
  contents: write
  pull-requests: write

# Never let two bump runs race for the same branches.
concurrency:
  group: bump-formulas
  cancel-in-progress: false

jobs:
  bump:
    # ubuntu rather than macos: the rewriter walks the AST and refreshes every
    # platform's url/sha256 regardless of the host, so nothing here needs macOS
    # — and Linux runners bill without the 10x macOS multiplier. Note that a
    # Linux *arm* runner would not work: deckhouse-cli publishes no
    # linux-arm64 asset, so the formula has no url to load on that platform.
    runs-on: ubuntu-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # So `gh` never has to infer the repository from a remote url that now
      # carries a token.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1

      - name: Give git a token to push with
        # setup-homebrew builds the working copy itself — `git init` plus
        # `git remote add origin https://github.com/<repo>` — after deleting
        # whatever actions/checkout left behind. That remote carries no
        # credentials, so a push fails with "could not read Username". This is
        # also why there is no checkout step above: its work would be thrown
        # away.
        run: |
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Verify the tap is visible
        # setup-homebrew already symlinks $GITHUB_WORKSPACE into Library/Taps
        # and runs `brew trust` on it (see its main.sh), so neither is repeated
        # here. This only turns a layout surprise into a readable failure
        # instead of a confusing "no such formula" further down.
        run: |
          brew ruby -e '
            tap = Tap.fetch("mihalych-pro/tap")
            unless tap.installed? && tap.formula_files.any?
              abort "tap is not visible to Homebrew at #{tap.path}"
            end
            puts "tap ready: #{tap.formula_files.count} formulae, #{tap.cask_files.count} casks"
          '

      - name: Install Task
        run: command -v task >/dev/null || brew install go-task

      - name: Install the gem groups the scripts need
        # `utils/ast` requires rubocop-ast, which lives in the optional `ast`
        # bundle group. Homebrew installs it for `bump-formula-pr`; nothing
        # installs it for us, so the bump script dies with
        # "cannot load such file -- rubocop-ast" on a fresh runner.
        # `style` covers `task audit`, `livecheck` the version checks.
        run: brew install-bundler-gems --add-groups=ast,style,livecheck

      - name: Report what is outdated
        run: task check

      - name: Collect the packages to bump
        id: collect
        env:
          REQUESTED: ${{ inputs.packages }}
        run: |
          # Without pipefail a crash in the script yields an empty list, and the
          # run reports "Nothing to bump" and goes green. That has happened.
          set -o pipefail

          if [ -n "$REQUESTED" ]; then
            names="$REQUESTED"
          else
            names="$(brew ruby scripts/update-formulas.rb -- --outdated | paste -sd' ' -)"
          fi
          if [ -z "$names" ]; then
            echo "Nothing to bump."
          else
            echo "Outdated: $names"
          fi
          echo "names=$names" >>"$GITHUB_OUTPUT"

      - name: Open one pull request per package
        if: steps.collect.outputs.names != ''
        env:
          NAMES: ${{ steps.collect.outputs.names }}
        run: |
          set -o pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The label is how the merge workflow recognises its own PRs, so it
          # has to exist before the first one is opened.
          gh label create automated-bump --force \
            --color ededed --description "Opened by the bump-formulas workflow"

          failed=""
          for name in $NAMES; do
            echo "::group::$name"

            # Start from a pristine main: a previous package may have failed
            # halfway and left edits behind.
            git reset --hard origin/main
            git switch -C "automated/bump-$name"

            log="$RUNNER_TEMP/bump-$name.log"
            if ! task update -- "$name" 2>&1 | tee "$log"; then
              echo "::error title=$name::bump failed"
              failed="$failed $name"
              echo "::endgroup::"
              continue
            fi

            if git diff --quiet -- Formula Casks; then
              echo "already up to date, nothing to commit"
              echo "::endgroup::"
              continue
            fi

            # The listings quote the version, so they belong in this commit.
            task docs

            if ! task audit -- "$name"; then
              echo "::error title=$name::audit failed, not opening a pull request"
              failed="$failed $name"
              echo "::endgroup::"
              continue
            fi

            # The script already prints exactly the line we want as a title:
            # "<name> (<kind>): <old> -> <new>".
            title="$(sed -nE "/^${name} \(.+\): .+ -> .+\$/p" "$log" | tail -1)"
            version="${title##* -> }"
            if [ -z "$title" ]; then
              echo "::error title=$name::could not read the versions out of the bump output"
              failed="$failed $name"
              echo "::endgroup::"
              continue
            fi

            # Explicit paths rather than `-a`: the listings may still be
            # untracked on the very first run, and nothing else should slip in.
            git add -- Formula Casks FORMULAE.md CASKS.md
            git commit --quiet -m "$name $version"
            git push --quiet --force-with-lease origin "automated/bump-$name"

            # Reuse the open pull request for this branch if there is one. Its
            # title has to be refreshed too: a second bump before the merge
            # window moves the target version, and a stale title would name a
            # version the branch no longer carries.
            number="$(gh pr list --head "automated/bump-$name" --state open --json number --jq '.[0].number // empty')"
            if [ -z "$number" ]; then
              gh pr create --base main --head "automated/bump-$name" \
                --label automated-bump \
                --title "$title" \
                --body "Bumped by \`task update\`. \`task audit\` passed on Linux."
            else
              gh pr edit "$number" --title "$title"
              echo "updated pull request #$number"
            fi

            echo "::endgroup::"
          done

          git reset --hard origin/main

          if [ -n "$failed" ]; then
            echo "Failed:$failed"
            exit 1
          fi
