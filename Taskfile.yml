version: "3"

vars:
  TAP: mihalych-pro/tap
  # Packages this tap actually owns; `test` installs them, everything else
  # works across the whole tap.
  MAINTAINED: deckhouse-cli deckhouse-module-tool flant-flint werf

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_FROM_API: "1"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  update:
    desc: Bump every formula and cask in the tap to its latest release
    summary: |
      Runs entirely inside Homebrew's own Ruby, no subprocesses: Tap for
      discovery, Livecheck for versions, Resource for downloads, Utils::AST for
      parsing, and Homebrew's BumpCaskPr / BumpFormulaPr command classes called
      directly. Only the per-platform formulas are rewritten by hand.

      Needs the tap trusted once, since building the package objects evaluates
      its Ruby:
        brew trust --tap mihalych-pro/tap

      Pass names to limit the run, or extra flags after --:
        task update -- werf wesnoth
        task update -- --dry-run
        task update -- werf --set 2.76.0

      Recomputing per-platform checksums re-downloads the artifacts; a full
      werf bump moves roughly 450 MB.
    cmds:
      # The `--` keeps `brew ruby` from claiming the script's own flags.
      - brew ruby scripts/update-formulas.rb -- {{.CLI_ARGS}}

  check:
    desc: Report which packages are outdated, without changing anything
    summary: |
      Wraps `brew livecheck`, which prints "current ==> latest" but never says
      whether that difference means anything -- and two versions can read as
      different while comparing equal (2.01.3 is the same version as 2.1.3 to
      Homebrew). The status word comes from the `outdated` flag in its JSON.
    cmds:
      - brew livecheck --tap={{.TAP}} --json | brew ruby scripts/report-versions.rb

  docs:
    desc: Regenerate FORMULAE.md and CASKS.md from the packages
    summary: |
      Name, description and version are read out of the package objects, so the
      tables cannot drift from the .rb files. The "Updated" column keeps the day
      a version was first recorded here.

      Pass -- --check to fail instead of writing, e.g. in CI:
        task docs -- --check
    cmds:
      - brew ruby scripts/generate-docs.rb -- {{.CLI_ARGS}}

  audit:
    desc: Style and audit the tap (pass names to limit, e.g. task audit -- werf)
    vars:
      REFS: '{{range $n := splitList " " .CLI_ARGS}}{{if $n}}{{$.TAP}}/{{$n}} {{end}}{{end}}'
    cmds:
      - brew style {{if .CLI_ARGS}}{{.REFS}}{{else}}{{.TAP}}{{end}}
      - brew audit --strict {{if .CLI_ARGS}}{{.REFS}}{{else}}--tap={{.TAP}}{{end}}
      - task: readall

  readall:
    desc: Load every package for every OS/arch combination, as `brew tap` does
    summary: |
      `brew tap` verifies a tap with Readall.valid_tap?, which builds each
      formula and cask under every entry of OnSystem::ALL_OS_ARCH_COMBINATIONS.
      A package with no url on one of them -- an architecture upstream does not
      build for -- fails the whole tap with "Cannot tap ...: invalid syntax in
      tap!", and neither `brew style` nor `brew audit` reports it.

      It also stays hidden locally: the tap is symlinked here rather than
      tapped, so `brew tap` never runs against it.
    cmds:
      - >-
        brew ruby -e 'require "readall";
        exit(1) unless Readall.valid_tap?(Tap.fetch("{{.TAP}}"), aliases: true)'

  fix:
    desc: Auto-correct the style offences that RuboCop can fix itself
    cmds:
      - brew style --fix {{.TAP}}

  test:
    desc: Install and run the test block of each maintained formula
    summary: |
      Installs the formulas into the local Homebrew prefix, so they shadow any
      trdl-installed d8, dmt, flint or werf on your PATH.
    cmds:
      - for: { var: MAINTAINED, split: " ", as: FORMULA }
        cmd: brew reinstall {{.TAP}}/{{.FORMULA}} && brew test {{.TAP}}/{{.FORMULA}}
